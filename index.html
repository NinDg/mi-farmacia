<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaGuard - Control de Medicamentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-pills text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">PharmaGuard Plus</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="forzarLimpiezaTotal()" class="bg-red-500 hover:bg-red-600 text-xs px-2.5 py-2 rounded-lg font-medium transition shadow-sm" title="Limpiar datos">
                    <i class="fa-solid fa-broom"></i> Reset
                </button>
                <button id="btnNotifPermiso" onclick="solicitarPermisoNotificaciones()" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-bell"></i>
                    <span id="txtNotifBtn">Alertas</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Panel de Acciones -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <button onclick="abrirScanner()" class="bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-50 p-4 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition font-semibold">
                <i class="fa-solid fa-qrcode text-2xl"></i>
                <span>Escanear y Consultar AEMPS (HD)</span>
            </button>
            <button onclick="abrirModalManual()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition font-semibold">
                <i class="fa-solid fa-plus-circle text-2xl"></i>
                <span>Añadir Manualmente</span>
            </button>
        </div>

        <!-- Indicador de Carga / Consulta AEMPS -->
        <div id="loadingAemps" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-xl mb-4 text-center text-sm font-medium animate-pulse">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Consultando base de datos oficial de la AEMPS...
        </div>

        <!-- Sección del Escáner -->
        <div id="scannerContainer" class="hidden bg-white p-4 rounded-2xl shadow-md mb-6 border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-camera text-emerald-600"></i>
                    <span>Escáner Inteligente DataMatrix / C.N.</span>
                </h2>
                <button onclick="cerrarScanner()" class="text-slate-400 hover:text-slate-600 font-bold px-2 py-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-100"></div>
            
            <div class="mt-4 pt-3 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 mb-2">Sube una foto clara del DataMatrix si la cámara directa no enfoca:</p>
                <label class="inline-flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer transition">
                    <i class="fa-solid fa-file-image"></i>
                    <span>Subir foto del DataMatrix</span>
                    <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="escanearArchivoImagen(event)">
                </label>
            </div>
        </div>

        <!-- Buscador y Filtros -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-200 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="buscador" oninput="filtrarMedicamentos()" placeholder="Buscar por nombre, C.N. o lote..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <select id="filtroEstado" onchange="filtrarMedicamentos()" class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                <option value="todos">Todos los estados</option>
                <option value="activo">🟢 Correctos (+30 días)</option>
                <option value="proximo">🟡 Próximos a caducar (&le;30 días)</option>
                <option value="caducado">🔴 Caducados</option>
            </select>
        </div>

        <!-- Lista de Medicamentos -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Inventario de Medicamentos</h2>
                <span id="contadorMeds" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">0 items</span>
            </div>
            <div id="listaMedicamentos" class="divide-y divide-slate-100"></div>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="modalMedicamento" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="font-bold text-lg text-slate-800">Registrar Medicamento</h3>
                <button onclick="cerrarModalManual()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="formMedicamento" onsubmit="guardarMedicamento(event)">
                <input type="hidden" id="medId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre del Medicamento (AEMPS) *</label>
                        <input type="text" id="nombreMed" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm font-semibold text-emerald-800 bg-emerald-50/30" placeholder="Se rellenará automáticamente al escanear">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Código Nacional (C.N.)</label>
                            <input type="text" id="cnMed" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm font-mono" placeholder="Automático">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lote</label>
                            <input type="text" id="loteMed" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Automático">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Dosis</label>
                            <input type="text" id="dosisMed" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Ej. 1 comp. cada 8h">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha de Caducidad *</label>
                            <input type="date" id="fechaMed" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Instrucciones / Notas</label>
                        <textarea id="notasMed" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Ej. Tomar con alimentos."></textarea>
                    </div>
                </div>
                <div class="mt-6 flex space-x-3">
                    <button type="button" onclick="cerrarModalManual()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">Guardar en Inventario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script con Integración AEMPS CIMA -->
    <script>
        let medicamentos = JSON.parse(localStorage.getItem('pharma_medicamentos')) || [];
        let html5QrCode = null;
        let scannerActivo = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderizarMedicamentos();
            if (Notification.permission === "granted") {
                document.getElementById('txtNotifBtn').innerText = "Alertas Activas";
            }
        });

        function abrirScanner() {
            document.getElementById('scannerContainer').classList.remove('hidden');
            if (!scannerActivo) {
                html5QrCode = new Html5Qrcode("reader");
                
                const formatsToSupport = [
                    Html5QrcodeSupportedFormats.DATA_MATRIX,
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128
                ];

                const config = {
                    fps: 15,
                    qrbox: { width: 300, height: 180 },
                    formatsToSupport: formatsToSupport,
                    videoConstraints: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "environment"
                    }
                };

                html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                    procesarCodigoEscaneado(decodedText);
                    cerrarScanner();
                }, () => {}).catch(() => {
                    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                        procesarCodigoEscaneado(decodedText);
                        cerrarScanner();
                    });
                });

                scannerActivo = true;
            }
        }

        function cerrarScanner() {
            if (html5QrCode && scannerActivo) {
                html5QrCode.stop().then(() => {
                    scannerActivo = false;
                    document.getElementById('scannerContainer').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scannerContainer').classList.add('hidden');
                    scannerActivo = false;
                });
            } else {
                document.getElementById('scannerContainer').classList.add('hidden');
            }
        }

        function escanearArchivoImagen(e) {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            const html5QrCodeFile = new Html5Qrcode("reader");
            
            const formatsToSupport = [
                Html5QrcodeSupportedFormats.DATA_MATRIX,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.CODE_128
            ];

            html5QrCodeFile.scanFileV2(imageFile, formatsToSupport, true)
                .then(decodedResult => {
                    procesarCodigoEscaneado(decodedResult.decodedText);
                    cerrarScanner();
                })
                .catch(() => {
                    html5QrCodeFile.scanFile(imageFile, true)
                        .then(decodedText => {
                            procesarCodigoEscaneado(decodedText);
                            cerrarScanner();
                        })
                        .catch(() => alert("No se pudo leer el código en la imagen. Asegúrate de enfocar bien solo la zona del DataMatrix."));
                });
        }

        // Función principal: Procesa el DataMatrix, extrae lote/caducidad y consulta el nombre a la AEMPS
        async function procesarCodigoEscaneado(textoBruto) {
            document.getElementById('cnMed').value = textoBruto;
            document.getElementById('loteMed').value = "";
            document.getElementById('fechaMed').value = "";
            document.getElementById('nombreMed').value = "Buscando medicamento en la AEMPS...";

            // 1. Extraer Código Nacional (C.N.) para la AEMPS (intentando aislar los 6 dígitos del C.N. habituales)
            let codigoNacional = extraerCodigoNacional(textoBruto);

            // 2. Extraer Caducidad GS1 (AI '17')
            let matchCad = textoBruto.match(/17(\d{2})(\d{2})(\d{2})/);
            if (matchCad) {
                let yy = "20" + matchCad[1];
                let mm = matchCad[2];
                let dd = matchCad[3];
                if (dd === "00") dd = "01";
                document.getElementById('fechaMed').value = `${yy}-${mm}-${dd}`;
            }

            // 3. Extraer Lote GS1 (AI '10')
            let matchLote = textoBruto.match(/10([A-Za-z0-9\-]+)/);
            if (matchLote) {
                document.getElementById('loteMed').value = matchLote[1].substring(0, 15);
            }

            // 4. Consultar API pública de la AEMPS (CIMA)
            if (codigoNacional) {
                document.getElementById('loadingAemps').classList.remove('hidden');
                try {
                    const response = await fetch(`https://cima.aemps.es/cima/rest/medicamento?cn=${codigoNacional}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.nombre) {
                            document.getElementById('nombreMed').value = data.nombre;
                        } else {
                            document.getElementById('nombreMed').value = "";
                            alert("Código Nacional encontrado en la AEMPS, pero sin nombre asociado. Escríbelo manualmente.");
                        }
                    } else {
                        document.getElementById('nombreMed').value = "";
                    }
                } catch (error) {
                    console.error("Error al consultar AEMPS:", error);
                    document.getElementById('nombreMed').value = "";
                } finally {
                    document.getElementById('loadingAemps').classList.add('hidden');
                }
            } else {
                document.getElementById('nombreMed').value = "";
            }

            abrirModalManual();
        }

        // Extractor auxiliar para obtener el Código Nacional de 6 dígitos del texto del DataMatrix
        function extraerCodigoNacional(texto) {
            // A veces el DataMatrix empieza con el identificador AI '21' o '01' (GTIN de 14 dígitos donde los dígitos 8 al 13 son el C.N.)
            let matchGtin = texto.match(/01(\d{14})/);
            if (matchGtin) {
                let gtin14 = matchGtin[1];
                // El C.N. en España suele extraerse de las posiciones 8 a 13 del GTIN
                let cnCalculado = gtin14.substring(7, 13).replace(/^0+/, '');
                return cnCalculado;
            }
            // Si es directamente un número de 6 o 7 dígitos limpio
            let limpio = texto.replace(/\D/g, '');
            if (limpio.length >= 6) {
                return limpio.substring(limpio.length - 6);
            }
            return texto;
        }

        function abrirModalManual() {
            document.getElementById('modalMedicamento').classList.remove('hidden');
        }

        function cerrarModalManual() {
            document.getElementById('modalMedicamento').classList.add('hidden');
            document.getElementById('formMedicamento').reset();
            document.getElementById('medId').value = '';
        }

        function guardarMedicamento(e) {
            e.preventDefault();
            const id = document.getElementById('medId').value;
            const nombre = document.getElementById('nombreMed').value.trim();
            const cn = document.getElementById('cnMed').value || 'Sin C.N.';
            const lote = document.getElementById('loteMed').value || 'Sin lote';
            const dosis = document.getElementById('dosisMed').value || '';
            const fecha = document.getElementById('fechaMed').value;
            const notas = document.getElementById('notasMed').value || '';

            if (id) {
                const index = medicamentos.findIndex(m => m.id == id);
                if (index !== -1) medicamentos[index] = { id: Number(id), nombre, cn, lote, dosis, fecha, notas };
            } else {
                medicamentos.push({ id: Date.now(), nombre, cn, lote, dosis, fecha, notas });
            }

            localStorage.setItem('pharma_medicamentos', JSON.stringify(medicamentos));
            cerrarModalManual();
            renderizarMedicamentos();
        }

        function forzarLimpiezaTotal() {
            if(confirm("¿Deseas reiniciar todos los datos y la memoria?")) {
                localStorage.clear();
                medicamentos = [];
                renderizarMedicamentos();
                alert("Memoria restablecida por completo.");
            }
        }

        function calcularEstado(fechaStr) {
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            const fechaCad = new Date(fechaStr);
            fechaCad.setHours(0,0,0,0);
            const dias = Math.ceil((fechaCad - hoy) / (1000 * 60 * 60 * 24));

            if (dias < 0) return { clase: 'bg-red-50 text-red-700 border-red-200', icono: 'fa-circle-xmark text-red-500', texto: 'Caducado', tipo: 'caducado' };
            if (dias <= 30) return { clase: 'bg-amber-50 text-amber-700 border-amber-200', icono: 'fa-triangle-exclamation text-amber-500', texto: `Vence en ${dias} días`, tipo: 'proximo' };
            return { clase: 'bg-emerald-50 text-emerald-700 border-emerald-200', icono: 'fa-circle-check text-emerald-500', texto: `Correcto (${dias} días)`, tipo: 'activo' };
        }

        function renderizarMedicamentos() {
            const lista = document.getElementById('listaMedicamentos');
            const buscador = document.getElementById('buscador').value.toLowerCase();
            const filtroEstado = document.getElementById('filtroEstado').value;

            const filtrados = medicamentos.filter(med => {
                const txt = med.nombre.toLowerCase().includes(buscador) || med.cn.toLowerCase().includes(buscador) || med.lote.toLowerCase().includes(buscador);
                const est = calcularEstado(med.fecha);
                return txt && (filtroEstado === 'todos' || est.tipo === filtroEstado);
            });

            document.getElementById('contadorMeds').innerText = `${filtrados.length} items`;
            if (filtrados.length === 0) {
                lista.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-box-open text-3xl mb-2"></i><p>No se encontraron medicamentos.</p></div>`;
                return;
            }

            lista.innerHTML = filtrados.map(med => {
                const est = calcularEstado(med.fecha);
                return `
                    <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-slate-50 transition">
                        <div class="flex items-start space-x-3">
                            <div class="mt-1"><i class="fa-solid ${est.icono} text-lg"></i></div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">${med.nombre}</h3>
                                <p class="text-xs text-slate-500 space-x-2">
                                    <span>C.N.: <strong class="text-slate-700 font-mono">${med.cn}</strong></span>
                                    <span>• Lote: <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">${med.lote}</span></span>
                                    ${med.dosis ? `<span>• Dosis: <em>${med.dosis}</em></span>` : ''}
                                </p>
                                <p class="text-xs text-slate-500 mt-0.5">Caduca: ${med.fecha} ${med.notas ? `• Notas: ${med.notas}` : ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                            <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${est.clase}">${est.texto}</span>
                            <div class="flex space-x-1">
                                <button onclick="editarMedicamento(${med.id})" class="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="eliminarMedicamento(${med.id})" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function filtrarMedicamentos() { renderizarMedicamentos(); }

        function editarMedicamento(id) {
            const med = medicamentos.find(m => m.id === id);
            if (med) {
                document.getElementById('medId').value = med.id;
                document.getElementById('nombreMed').value = med.nombre;
                document.getElementById('cnMed').value = med.cn;
                document.getElementById('loteMed').value = med.lote;
                document.getElementById('dosisMed').value = med.dosis;
                document.getElementById('fechaMed').value = med.fecha;
                document.getElementById('notasMed').value = med.notas;
                document.getElementById('modalTitulo').innerText = "Editar Medicamento";
                abrirModalManual();
            }
        }

        function eliminarMedicamento(id) {
            if (confirm("¿Deseas eliminar este medicamento?")) {
                medicamentos = medicamentos.filter(m => m.id !== id);
                localStorage.setItem('pharma_medicamentos', JSON.stringify(medicamentos));
                renderizarMedicamentos();
            }
        }

        function solicitarPermisoNotificaciones() {
            if (!("Notification" in window)) return alert("Tu navegador no soporta notificaciones.");
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('txtNotifBtn').innerText = "Alertas Activas";
                    new Notification("PharmaGuard Activado", { body: "Te avisaremos de las caducidades." });
                }
            });
        }
    </script>
</body>
</html>
