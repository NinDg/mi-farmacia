<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaGuard - Control de Medicamentos</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería Html5Qrcode para escaneo avanzado de QR y códigos de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-pills text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">PharmaGuard</h1>
            </div>
            <button id="btnNotifPermiso" onclick="solicitarPermisoNotificaciones()" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-bell"></i>
                <span id="txtNotifBtn">Activar Alertas</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Panel de Acciones Rápidas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <button onclick="abrirScanner()" class="bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-50 p-4 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition font-semibold">
                <i class="fa-solid fa-qrcode text-2xl"></i>
                <span>Escanear Código (Cámara HD)</span>
            </button>
            <button onclick="abrirModalManual()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition font-semibold">
                <i class="fa-solid fa-plus-circle text-2xl"></i>
                <span>Añadir Manualmente</span>
            </button>
        </div>

        <!-- Sección del Escáner (Oculta por defecto) -->
        <div id="scannerContainer" class="hidden bg-white p-4 rounded-2xl shadow-md mb-6 border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-camera text-emerald-600"></i>
                    <span>Escáner de Medicamentos</span>
                </h2>
                <button onclick="cerrarScanner()" class="text-slate-400 hover:text-slate-600 font-bold px-2 py-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-100"></div>
            
            <!-- Opción alternativa: Subir foto si la cámara no enfoca bien -->
            <div class="mt-4 pt-3 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 mb-2">¿El código se resiste? Hazle una foto con tu cámara normal y súbela aquí:</p>
                <label class="inline-flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer transition">
                    <i class="fa-solid fa-file-image"></i>
                    <span>Subir foto de código / QR</span>
                    <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="escanearArchivoImagen(event)">
                </label>
            </div>
        </div>

        <!-- Buscador y Filtros -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-200 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="buscador" oninput="filtrarMedicamentos()" placeholder="Buscar por nombre o lote..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <select id="filtroEstado" onchange="filtrarMedicamentos()" class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                <option value="todos">Todos los estados</option>
                <option value="activo">🟢 Correctos (+30 días)</option>
                <option value="proximo">🟡 Próximos a caducar (&le;30 días)</option>
                <option value="caducado">🔴 Caducados</option>
            </select>
        </div>

        <!-- Lista de Medicamentos -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Inventario de Medicamentos</h2>
                <span id="contadorMeds" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">0 items</span>
            </div>
            <div id="listaMedicamentos" class="divide-y divide-slate-100">
                <!-- Se rellena dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Modal Formulario Manual -->
    <div id="modalMedicamento" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl animate-scale">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="font-bold text-lg text-slate-800">Registrar Medicamento</h3>
                <button onclick="cerrarModalManual()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="formMedicamento" onsubmit="guardarMedicamento(event)">
                <input type="hidden" id="medId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre del Medicamento</label>
                        <input type="text" id="nombreMed" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Ej. Paracetamol 1g">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lote / Código</label>
                        <input type="text" id="loteMed" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Ej. L-89234 o Código de barras">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha de Caducidad</label>
                        <input type="date" id="fechaMed" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 text-sm">
                    </div>
                </div>
                <div class="mt-6 flex space-x-3">
                    <button type="button" onclick="cerrarModalManual()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de la Aplicación -->
    <script>
        let medicamentos = JSON.parse(localStorage.getItem('pharma_medicamentos')) || [];
        let html5QrCode = null;
        let scannerActivo = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderizarMedicamentos();
            verificarNotificacionesPendientes();
            if (Notification.permission === "granted") {
                document.getElementById('txtNotifBtn').innerText = "Alertas Activas";
            }
        });

        // Configuración de la cámara con resolución HD forzada y soporte ampliado de formatos
        function abrirScanner() {
            const container = document.getElementById('scannerContainer');
            container.classList.remove('hidden');
            
            if (!scannerActivo) {
                html5QrCode = new Html5Qrcode("reader");
                
                // Forzamos resolución HD (1280x720) para mejorar la nitidez en códigos pequeños
                const configConfig = {
                    fps: 15,
                    qrbox: { width: 250, height: 150 },
                    aspectRatio: 1.0,
                    videoConstraints: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "environment" // Usa la cámara trasera por defecto en móviles
                    }
                };

                html5QrCode.start(
                    { facingMode: "environment" },
                    configConfig,
                    (decodedText, decodedResult) => {
                        // Éxito al leer código
                        manejarCodigoEscaneado(decodedText);
                        cerrarScanner();
                    },
                    (errorMessage) => {
                        // Errores de lectura por frame (se ignoran para que siga intentando enfocar fluidamente)
                    }
                ).catch(err => {
                    console.error("Error al iniciar la cámara:", err);
                    alert("No se pudo iniciar la cámara. Comprueba los permisos de tu navegador.");
                });
                
                scannerActivo = true;
            }
        }

        function cerrarScanner() {
            if (html5QrCode && scannerActivo) {
                html5QrCode.stop().then(() => {
                    scannerActivo = false;
                    document.getElementById('scannerContainer').classList.add('hidden');
                }).catch(err => {
                    console.error("Error al detener el escáner", err);
                    document.getElementById('scannerContainer').classList.add('hidden');
                    scannerActivo = false;
                });
            } else {
                document.getElementById('scannerContainer').classList.add('hidden');
            }
        }

        // Nueva función: Escanear archivo de imagen subido (por si la cámara en directo no enfoca bien)
        function escanearArchivoImagen(e) {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            
            const html5QrCodeFile = new Html5Qrcode("reader");
            html5QrCodeFile.scanFile(imageFile, true)
                .then(decodedText => {
                    manejarCodigoEscaneado(decodedText);
                    cerrarScanner();
                })
                .catch(err => {
                    alert("No se pudo leer ningún código o QR en la imagen. Asegúrate de que se vea nítido e inténtalo de nuevo.");
                    console.error(err);
                });
        }

        function manejarCodigoEscaneado(codigo) {
            document.getElementById('loteMed').value = codigo;
            document.getElementById('nombreMed').value = "Medicamento (" + codigo.substring(0, 8) + ")";
            abrirModalManual();
        }

        // Gestión del Modal Manual
        function abrirModalManual() {
            document.getElementById('modalMedicamento').classList.remove('hidden');
            if(!document.getElementById('medId').value) {
                document.getElementById('formMedicamento').reset();
                document.getElementById('medId').value = '';
                document.getElementById('modalTitulo').innerText = "Registrar Medicamento";
            }
        }

        function cerrarModalManual() {
            document.getElementById('modalMedicamento').classList.add('hidden');
            document.getElementById('formMedicamento').reset();
            document.getElementById('medId').value = '';
        }

        // Guardar o Editar
        function guardarMedicamento(e) {
            e.preventDefault();
            const id = document.getElementById('medId').value;
            const nombre = document.getElementById('nombreMed').value;
            const lote = document.getElementById('loteMed').value || 'Sin lote';
            const fecha = document.getElementById('fechaMed').value;

            if (id) {
                const index = medicamentos.findIndex(m => m.id == id);
                if (index !== -1) {
                    medicamentos[index] = { id: Number(id), nombre, lote, fecha };
                }
            } else {
                const nuevoMed = {
                    id: Date.now(),
                    nombre,
                    lote,
                    fecha
                };
                medicamentos.push(nuevoMed);
            }

            localStorage.setItem('pharma_medicamentos', JSON.stringify(medicamentos));
            cerrarModalManual();
            renderizarMedicamentos();
            verificarNotificacionesPendientes();
        }

        // Calcular estado y días restantes
        function calcularEstado(fechaStr) {
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            const fechaCad = new Date(fechaStr);
            fechaCad.setHours(0,0,0,0);

            const diferenciaDias = Math.ceil((fechaCad - hoy) / (1000 * 60 * 60 * 24));

            if (diferenciaDias < 0) {
                return { clase: 'bg-red-50 text-red-700 border-red-200', icono: 'fa-circle-xmark text-red-500', texto: 'Caducado', tipo: 'caducado' };
            } else if (diferenciaDias <= 30) {
                return { clase: 'bg-amber-50 text-amber-700 border-amber-200', icono: 'fa-triangle-exclamation text-amber-500', texto: `Vence en ${diferenciaDias} días`, tipo: 'proximo' };
            } else {
                return { clase: 'bg-emerald-50 text-emerald-700 border-emerald-200', icono: 'fa-circle-check text-emerald-500', texto: `Correcto (${diferenciaDias} días)`, tipo: 'activo' };
            }
        }

        // Renderizado de la lista
        function renderizarMedicamentos() {
            const lista = document.getElementById('listaMedicamentos');
            const buscador = document.getElementById('buscador').value.toLowerCase();
            const filtroEstado = document.getElementById('filtroEstado').value;

            const filtrados = medicamentos.filter(med => {
                const coincideTexto = med.nombre.toLowerCase().includes(buscador) || med.lote.toLowerCase().includes(buscador);
                const estadoObj = calcularEstado(med.fecha);
                const coincideEstado = filtroEstado === 'todos' || estadoObj.tipo === filtroEstado;
                return coincideTexto && coincideEstado;
            });

            document.getElementById('contadorMeds').innerText = `${filtrados.length} items`;

            if (filtrados.length === 0) {
                lista.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-box-open text-3xl mb-2"></i><p>No se encontraron medicamentos registrados.</p></div>`;
                return;
            }

            lista.innerHTML = filtrados.map(med => {
                const estado = calcularEstado(med.fecha);
                return `
                    <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-slate-50/80 transition">
                        <div class="flex items-start space-x-3">
                            <div class="mt-1"><i class="fa-solid ${estado.icono} text-lg"></i></div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">${med.nombre}</h3>
                                <p class="text-xs text-slate-500">Lote: <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">${med.lote}</span> • Caduca: ${med.fecha}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                            <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${estado.clase}">${estado.texto}</span>
                            <div class="flex space-x-1">
                                <button onclick="editarMedicamento(${med.id})" class="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="eliminarMedicamento(${med.id})" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filtrarMedicamentos() {
            renderizarMedicamentos();
        }

        function editarMedicamento(id) {
            const med = medicamentos.find(m => m.id === id);
            if (med) {
                document.getElementById('medId').value = med.id;
                document.getElementById('nombreMed').value = med.nombre;
                document.getElementById('loteMed').value = med.lote;
                document.getElementById('fechaMed').value = med.fecha;
                document.getElementById('modalTitulo').innerText = "Editar Medicamento";
                abrirModalManual();
            }
        }

        function eliminarMedicamento(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este medicamento?")) {
                medicamentos = medicamentos.filter(m => m.id !== id);
                localStorage.setItem('pharma_medicamentos', JSON.stringify(medicamentos));
                renderizarMedicamentos();
                verificarNotificacionesPendientes();
            }
        }

        // Sistema de Notificaciones Web (Notification API)
        function solicitarPermisoNotificaciones() {
            if (!("Notification" in window)) {
                alert("Este navegador no soporta notificaciones de escritorio.");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('txtNotifBtn').innerText = "Alertas Activas";
                    new Notification("PharmaGuard Activado", {
                        body: "Te avisaremos cuando algún medicamento esté próximo a caducar.",
                        icon: "https://cdn-icons-png.flaticon.com/512/822/822143.png"
                    });
                } else {
                    alert("Has denegado los permisos de notificación.");
                }
            });
        }

        function verificarNotificacionesPendientes() {
            if (Notification.permission !== "granted") return;

            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            medicamentos.forEach(med => {
                const fechaCad = new Date(med.fecha);
                fechaCad.setHours(0,0,0,0);
                const diferenciaDias = Math.ceil((fechaCad - hoy) / (1000 * 60 * 60 * 24));

                if (diferenciaDias <= 30 && diferenciaDias >= 0) {
                    // Evitamos spamear mandando una por cada uno si ya se revisó, pero lanzamos alerta general
                    console.log(`Alerta: ${med.nombre} vence en ${diferenciaDias} días.`);
                }
            });
        }
    </script>
</body>
</html>
